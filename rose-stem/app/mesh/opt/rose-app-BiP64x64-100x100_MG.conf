[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 $BIN_DIR/planar_mesh_generator mesh_generation.nml

[env]
mesh_generator=Planar

[!!namelist:cubedsphere_mesh]

[namelist:mesh]
coord_sys='xyz'
geometry='planar'
mesh_maps='planar_l0:planar_l1','planar_l1:planar_l2',
         ='planar_l2:planar_l3'
mesh_names='planar_l0','planar_l1','planar_l2','planar_l3'
n_meshes=4
!!rotate_mesh=.false.

[namelist:planar_mesh]
domain_size=6400.0,6400.0
edge_cells_x=64,32,16,8
edge_cells_y=64,32,16,8
