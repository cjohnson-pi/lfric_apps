[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 $BIN_DIR/cubedsphere_mesh_generator mesh_generation.nml
srun=mkdir -p $MESH_DIR ; srun --ntasks=1 $BIN_DIR/cubedsphere_mesh_generator mesh_generation.nml

[namelist:cubedsphere_mesh]
edge_cells=224,112,56,28

[namelist:mesh]
mesh_maps='cubedsphere_l0:cubedsphere_l1',
         ='cubedsphere_l1:cubedsphere_l2',
         ='cubedsphere_l2:cubedsphere_l3'
mesh_names='cubedsphere_l0','cubedsphere_l1','cubedsphere_l2',
          ='cubedsphere_l3'
n_meshes=4
partition_mesh=.true.

[namelist:partitions]
max_stencil_depth=10
n_partitions=$TOTAL_RANKS
partition_range=0,$FINAL_RANK
