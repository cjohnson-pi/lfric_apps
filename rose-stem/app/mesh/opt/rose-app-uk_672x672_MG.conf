[command]
default=mkdir -p $MESH_DIR ; mpiexec -n 1 $BIN_DIR/planar_mesh_generator mesh_generation.nml

[env]
mesh_generator=Planar

[!!namelist:cubedsphere_mesh]

[namelist:mesh]
mesh_maps='l0_planar:l1_planar','l1_planar:l2_planar',
         ='l2_planar:l3_planar','l0_planar:l3_planar'
mesh_names='l0_planar','l1_planar','l2_planar','l3_planar'
n_meshes=4
rotate_mesh=.true.
topology='non_periodic'

[namelist:planar_mesh]
domain_centre=358.503,1.9628
domain_size=9.3408,9.8784
edge_cells_x=672,336,168,84
edge_cells_y=672,336,168,84
periodic_x=.false.
periodic_y=.false.

[namelist:rotation]
target_north_pole=177.5,37.5
