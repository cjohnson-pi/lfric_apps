[file:iodef.xml]
source=$ROSE_SUITE_DIR/app/lfric_atm/file/iodef_gal_nwp_hres.xml

[file:mesh_C896_MG.nc]
mode=auto
source=$MESH_DIR/mesh_C896_MG.nc

[namelist:base_mesh]
!!f_lat_deg=
file_prefix='mesh_C896_MG'
!!fplane=

[namelist:files]
coarse_ancil_directory='$BIG_DATA_DIR/ancils/basic-gal/yak/C224'
start_dump_filename='nwp-gal9_N1280L70_${RESOLUTION}L70'

[namelist:formulation]
use_multires_coupling=.true.

[namelist:initialization]
coarse_aerosol_ancil=.true.
coarse_ozone_ancil=.true.

[namelist:multires_coupling]
aerosol_mesh_name='l2_cubedsphere'
lowest_order_aero_flag=.false.
multires_coupling_mesh_tags='l0_cubedsphere','l2_cubedsphere'
orography_mesh_name='l0_cubedsphere'
physics_mesh_name='l0_cubedsphere'

[namelist:radiation]
n_radstep=15
